# As If model catalogue: the shortlist from §9.2 of docs/DESIGN.md.
#
# weights_gb    the 4-bit (Q4) GGUF, as §9.2 gives it
# projector_gb  the vision projector, where §9.2 gives it separately (else 0.0)
# min_vram_gb   VRAM from which this is the GPU pick (§10); absent = not a GPU-tier model
# min_ram_gb    RAM from which this is the CPU pick (§10)
# languages     primary language subtags, or ["*"] for multilingual
#
# Nothing is pinned yet. `revision`, file names and `sha256` stay empty until
# they are filled in when pinning (M2), copied from the upstream repo, never
# guessed. `repo` is filled in only where the design names one; the others are
# chosen when pinning, from official repos or well-known quantizers (§9.2).

[[model]]
id           = "minicpm-v-4.6-q4"
name         = "MiniCPM-V 4.6"
tier         = "T0"
arch         = "dense"
params       = "1.3B (SigLIP2-400M encoder + Qwen3.5-0.8B)"
weights_gb   = 1.6
projector_gb = 0.0                  # not given separately in §9.2; measured when pinning (M2)
min_ram_gb   = 8.0                  # "any 8 GB machine, CPU"
languages    = ["en", "zh"]         # the only listed languages
licence      = "Apache-2.0"
repo         = "ggml-org/MiniCPM-V-4.6-GGUF"
revision     = ""                   # filled in when pinning (M2)
notes        = "Best quality per byte. Lists English and Chinese only."
files = [
    # filled in when pinning (M2)
    { role = "weights", name = "", sha256 = "" },
    { role = "projector", name = "", sha256 = "" },
]

